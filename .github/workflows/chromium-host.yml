name: Chromium host
permissions:
  contents: read

on:
  pull_request:
    branches:
      - dev
    paths:
      - "chromium/**"
      - ".github/workflows/chromium-host.yml"
      - "rust-toolchain.toml"
  push:
    branches:
      - dev
    paths:
      - "chromium/**"
      - ".github/workflows/chromium-host.yml"
      - "rust-toolchain.toml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: chromium

      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Test
        run: cargo test --manifest-path chromium/Cargo.toml --locked --all-targets
        env:
          ZEN_CHROMIUM_BIN: ${{ steps.chrome.outputs.chrome-path }}

      - name: Clippy
        run: cargo clippy --manifest-path chromium/Cargo.toml --locked --all-targets -- -D warnings
