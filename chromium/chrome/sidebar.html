<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Zen</title>
    <link rel="stylesheet" href="/sidebar.css" />
  </head>
  <body>
    <div id="sidebar">
      <form id="urlbar">
        <input id="url" type="text" placeholder="Search or enter address" autocomplete="off" />
      </form>
      <div id="space-name">Space</div>
      <div id="spaces"></div>
      <div id="pinned"></div>
      <div class="separator"></div>
      <div id="tabs"></div>
      <div id="footer">
        <button id="new-tab" class="text-button" type="button"><span>New Tab</span></button>
        <button id="new-space" class="icon-button" type="button" title="New space">＋</button>
        <button id="compact" class="icon-button" type="button" title="Compact sidebar">▣</button>
        <button id="side" class="icon-button" type="button" title="Move sidebar">↔</button>
      </div>
    </div>
    <script src="/sidebar.js"></script>
  </body>
</html>
