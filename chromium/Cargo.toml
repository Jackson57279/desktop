[package]
name = "zen-chromium"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
publish = false
readme = false
description = "Chromium request host for Zen using Brave Browser's adblock engine"
autobins = false

[lib]
name = "zen_chromium"
path = "src/lib.rs"

[[bin]]
name = "zen-chromium"
path = "src/bin/zen_chromium.rs"

[dependencies]
adblock = { version = "=0.13.3", default-features = false, features = [
    "css-validation",
    "debug-info",
    "embedded-domain-resolver",
    "full-regex-handling",
] }
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
percent-encoding = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2.12.1"
url = "2.5"
